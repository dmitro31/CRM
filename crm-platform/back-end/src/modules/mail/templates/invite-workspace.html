<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; background-color: #f4f4f5; padding: 40px 0;">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table width="480" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; padding: 32px;">
            <tr>
              <td>
                <h2 style="margin: 0 0 16px; color: #111827;">Тебе запросили до workspace</h2>
                <p style="color: #374151; font-size: 15px; line-height: 1.5;">
                  Тебе запросили приєднатись до <strong>{{workspaceName}}</strong> з роллю <strong>{{roleName}}</strong>.
                </p>
                <p style="margin: 24px 0;">
                  <a href="{{url}}" style="background-color: #2563eb; color: #ffffff; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-size: 15px;">
                    Прийняти запрошення
                  </a>
                </p>
                <p style="color: #9ca3af; font-size: 13px;">
                  Посилання дійсне 7 днів. Якщо ти не очікував цього запрошення, просто ігноруй цей лист.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
