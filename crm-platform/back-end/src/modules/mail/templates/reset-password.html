<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Скидання пароля</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f7;
      color: #333333;
      margin: 0;
      padding: 0;
      width: 100% !important;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      background-color: #ffffff;
      border-radius: 8px;
      padding: 32px;
      border: 1px solid #e5e7eb;
    }
    .header {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #111827;
    }
    .content {
      font-size: 16px;
      line-height: 1.6;
      color: #4b5563;
      margin-bottom: 28px;
    }
    .btn-wrapper {
      margin-bottom: 28px;
    }
    .button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #2563eb;
      color: #ffffff !important;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 15px;
    }
    .footer {
      font-size: 13px;
      line-height: 1.5;
      color: #9ca3af;
      border-top: 1px solid #e5e7eb;
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Скидання пароля</div>
    <div class="content">
      Вітаємо, {{name}}!<br><br>
      Ми отримали запит на скидання пароля для вашого акаунту. Щоб встановити новий пароль, натисніть кнопку нижче:
    </div>
    <div class="btn-wrapper">
      <a href="{{url}}" class="button" target="_blank">Скинути пароль</a>
    </div>
    <div class="footer">
      Якщо ви не робили цього запиту, просто ігноруйте цей лист.<br>
      Посилання є одноразовим і має обмежений термін дії.
    </div>
  </div>
</body>
</html>
