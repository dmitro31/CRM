name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - run: npm ci
      - run: npm run lint

  prisma-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma format --check

  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - run: npm ci
      - run: npm run test

  e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crm_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - run: npm ci

      - name: Create .env.test
        run: |
          cat << EOF > .env.test
          NODE_ENV=test
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/crm_platform_test
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_REFRESH_EXPIRES_IN=7d
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL=http://localhost:3000/auth/google/callback
          GITHUB_CLIENT_ID=${{ secrets.GH_OAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET=${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GITHUB_CALLBACK_URL=http://localhost:3000/auth/github/callback
          CORS_ORIGIN=http://localhost:5173
          REDIS_HOST=localhost
          REDIS_PORT=6379
          STORAGE_ENDPOINT=localhost
          STORAGE_PORT=9000
          STORAGE_USE_SSL=false
          STORAGE_ACCESS_KEY=minioadmin
          STORAGE_SECRET_KEY=minioadmin123
          STORAGE_BUCKET=crm-files
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL=gemini-3.6-flash
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          MAIL_APP_URL=http://localhost:3000
          EOF

      - run: npm run db:test:push
      - run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    needs: [lint, prisma-validate, unit-tests]
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: back-end/package-lock.json

      - run: npm ci
      - env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: npx prisma generate
      - run: npm run build